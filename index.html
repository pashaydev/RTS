<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RTS Prototype</title>
        <link
            data-trunk
            rel="rust"
            data-bin="rts"
            data-integrity="none"
            data-wasm-opt="0"
        />
        <link data-trunk rel="copy-dir" href="assets" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #1a1a1a;
            }
            #game-container {
                width: 100vw;
                height: 100vh;
            }
            canvas {
                display: block;
                width: 100% !important;
                height: 100% !important;
                position: absolute !important;
                top: 0;
                left: 0;
            }
        </style>
        <script>
            // Monkey-patch AudioContext to capture every instance Bevy creates,
            // then resume them all on the first user gesture (click / key / touch).
            (function () {
                var Ctor = window.AudioContext || window.webkitAudioContext;
                if (!Ctor) return;
                var contexts = [];
                var OrigAudioContext = Ctor;
                var PatchedAudioContext = function () {
                    var ctx = new OrigAudioContext();
                    contexts.push(ctx);
                    return ctx;
                };
                PatchedAudioContext.prototype = OrigAudioContext.prototype;
                window.AudioContext = PatchedAudioContext;
                if (window.webkitAudioContext)
                    window.webkitAudioContext = PatchedAudioContext;

                function unlock() {
                    for (var i = 0; i < contexts.length; i++) {
                        if (contexts[i].state === "suspended") {
                            contexts[i].resume();
                        }
                    }
                    if (contexts.length > 0) {
                        document.removeEventListener("click", unlock, true);
                        document.removeEventListener("keydown", unlock, true);
                        document.removeEventListener(
                            "touchstart",
                            unlock,
                            true,
                        );
                    }
                }
                document.addEventListener("click", unlock, true);
                document.addEventListener("keydown", unlock, true);
                document.addEventListener("touchstart", unlock, true);
            })();
        </script>

        <script>
            // DEBUG: Intercept WebGPU shader compilation errors.
            // Patches the prototype synchronously before WASM loads.
            (function () {
                if (!navigator.gpu) return;
                var orig = GPUDevice.prototype.createShaderModule;
                GPUDevice.prototype.createShaderModule = function (desc) {
                    var mod = orig.call(this, desc);
                    mod.getCompilationInfo().then(function (info) {
                        for (var i = 0; i < info.messages.length; i++) {
                            var m = info.messages[i];
                            if (m.type === "error") {
                                console.error(
                                    "WGSL ERROR [line " +
                                        m.lineNum +
                                        ":" +
                                        m.linePos +
                                        "]: " +
                                        m.message,
                                );
                                if (desc.code && m.lineNum > 0) {
                                    var lines = desc.code.split("\n");
                                    var s = Math.max(0, m.lineNum - 4);
                                    var e = Math.min(
                                        lines.length,
                                        m.lineNum + 3,
                                    );
                                    console.error(
                                        "Source:\n" +
                                            lines
                                                .slice(s, e)
                                                .map(function (l, j) {
                                                    var n = s + j + 1;
                                                    return (
                                                        (n === m.lineNum
                                                            ? ">>> "
                                                            : "    ") +
                                                        n +
                                                        ": " +
                                                        l
                                                    );
                                                })
                                                .join("\n"),
                                    );
                                }
                            }
                        }
                    });
                    return mod;
                };
            })();
        </script>
    </head>
    <body>
        <div id="game-container">
            <canvas id="canvas"></canvas>
        </div>
    </body>
</html>
